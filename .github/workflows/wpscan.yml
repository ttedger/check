name: WPScan WordPress Security Scan

on:
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Install WPScan
        run: sudo gem install wpscan

      - name: Run WPScan on dallolgebeya.com
        env:
          WPSCAN_API_TOKEN: ${{ secrets.WPSCAN_API_TOKEN }}
        run: |
          wpscan --url https://dallolgebeya.com \
                 --enumerate vp,vt,u \
                 --api-token $WPSCAN_API_TOKEN \
                 --format json \
                 --output wpscan-results.json

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: wpscan-results
          path: wpscan-results.json